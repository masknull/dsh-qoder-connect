name: Publish Package

# Publishes to npm using trusted publishing (OIDC): no long-lived npm token is
# read or stored anywhere in this repository.
#
# Preparation, in this order — the ordering matters:
#   1. this file must exist on the default branch under .github/workflows/,
#      with the exact filename configured on npmjs.com ("publish.yml");
#   2. then add the trusted publisher on npmjs.com (package Settings →
#      Trusted publishing → GitHub Actions): user "masknull", repository
#      "dsh-qoder-connect", workflow filename "publish.yml";
#   3. a newly created trusted publisher configuration must complete its first
#      successful publish within 2 days or it expires and cannot be edited.
#
# See https://docs.npmjs.com/trusted-publishers

on:
  push:
    tags: ['v*']
  # A tag pushed before this workflow existed cannot trigger it, so the first
  # publish is started by hand from the Actions tab.
  workflow_dispatch:

permissions:
  id-token: write # required: lets this job request the OIDC identity npm verifies
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing supports GitHub-hosted runners only
    steps:
      - uses: actions/checkout@v7

      # This repository is pnpm-managed (pnpm-lock.yaml, no package-lock.json), so
      # `npm ci` cannot run here — pnpm installs the tree. Every script below then
      # runs through npm, which is also what has to perform the publish: npm's CLI
      # is what detects the OIDC environment.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2 # the version that produced the committed lockfile

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds

      - run: pnpm install --frozen-lockfile

      - run: npm run typecheck

      # File-level parallelism is off on purpose: tests/settings-integration.spec.ts
      # boots a host and polls with vi.waitFor, and it flaked under full parallel
      # load locally (a different test each run, always green in isolation).
      - run: npm test -- --no-file-parallelism

      - run: npm run test:qoder

      - run: npm run build

      - name: Resolve the dist-tag from the package version
        id: dist_tag
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-alpha*) tag=alpha ;;
            *-beta*)  tag=beta ;;
            *-rc*)    tag=rc ;;
            *)        tag=latest ;;
          esac
          echo "publishing $version with --tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # No --provenance: publishing through trusted publishing from GitHub
      # generates provenance automatically. No NODE_AUTH_TOKEN / NPM_TOKEN either —
      # npm prefers OIDC over any token, and a token is exactly what this replaces.
      - run: npm publish --tag ${{ steps.dist_tag.outputs.tag }}

      # The same tarball npm accepted, kept for the release page. `--ignore-scripts`
      # skips the prepack build the publish above already ran.
      - name: Pack the published tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  # A tag push publishes the package and then announces it. Only tag pushes: a
  # manual dispatch has no tag to name a release after.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release is the only write this job needs
    steps:
      # Full history: the notes span the previous tag, which may be hundreds of
      # commits behind the shallow default.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Compose release notes for this tag's commit range
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # The tarball the publish job already produced; the release carries it so a
      # consumer can install from the release page without npm.
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/assets

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # A prerelease on npm must not become a stable (or Latest) release here;
          # both sides read the same version to decide.
          version="${tag#v}"
          prerelease=""
          latest=""
          case "$version" in
            *-*) prerelease="--prerelease"; latest="--latest=false" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" $prerelease $latest
            gh release upload "$tag" "$RUNNER_TEMP"/assets/*.tgz --clobber
          else
            gh release create "$tag" --verify-tag --title "$tag" $prerelease $latest \
              --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP"/assets/*.tgz
          fi
